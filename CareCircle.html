<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CareCircle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&display=swap">
<style>
/* Layout concept: a dark animated heartbeat-to-circle splash opens onto a passcode door,
   then a role-aware home. Elder gets a large single-action "next dose" screen; family and
   caretakers get the same day as a status view. Rail nav on desktop, bottom bar on phones. */
:root{
  --bg:#EEF3F1;--sf:#FFFFFF;--sf2:#F4F8F6;--ink:#10231F;--mut:#4F6B65;--line:#D3E1DC;
  --ac:#0B6B62;--acink:#FFFFFF;--acsoft:#DCF1EC;
  --good:#1B6B3A;--goodbg:#E0F4E7;--warn:#8A5300;--warnbg:#FFF0D1;--crit:#B3261E;--critbg:#FDE7E5;--info:#4B3FB5;--infobg:#E9E6FA;
  --shadow:0 1px 2px rgba(16,35,31,.06),0 10px 28px rgba(16,35,31,.07);
  --disp:"Bricolage Grotesque","Noto Sans Telugu","Noto Sans Devanagari",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Noto Sans Telugu","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sp-bg1:#0B3B38;--sp-bg2:#041514;--sp-mint:#5EEAD4;--sp-gold:#F6B73C;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1715;--sf:#11231F;--sf2:#162B27;--ink:#E6F2EF;--mut:#9DB8B2;--line:#24403A;
  --ac:#3DD6C2;--acink:#052420;--acsoft:#0F3A35;
  --good:#7FDDA0;--goodbg:#0F3320;--warn:#F5C15A;--warnbg:#3A2C0C;--crit:#FF9D96;--critbg:#3F1512;--info:#B7AEFF;--infobg:#25205A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1715;--sf:#11231F;--sf2:#162B27;--ink:#E6F2EF;--mut:#9DB8B2;--line:#24403A;
  --ac:#3DD6C2;--acink:#052420;--acsoft:#0F3A35;
  --good:#7FDDA0;--goodbg:#0F3320;--warn:#F5C15A;--warnbg:#3A2C0C;--crit:#FF9D96;--critbg:#3F1512;--info:#B7AEFF;--infobg:#25205A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
html{font-size:17px}html.sz2{font-size:19px}html.sz3{font-size:21.5px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;min-height:100vh}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:8px}
.ico{display:inline-flex;vertical-align:middle;flex:none}
.mut{color:var(--mut)}.sm{font-size:.86rem}.tab{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--sf);color:var(--ink);font-weight:700;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.btn.good{background:var(--good);color:var(--goodbg);border-color:var(--good)}
.btn.crit{background:var(--crit);color:var(--critbg);border-color:var(--crit)}
.btn.gh{background:transparent}
.btn.sq{padding:0;width:44px}
.btn.big{min-height:60px;font-size:1.15rem;padding:12px 22px;border-radius:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--sf2);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.chip.good{background:var(--goodbg);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--critbg);color:var(--crit);border-color:transparent}
.chip.info{background:var(--infobg);color:var(--info);border-color:transparent}
.chip.ac{background:var(--acsoft);color:var(--ac);border-color:transparent}
/* cards */
.card{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card>h2,.card>.hd{margin-bottom:12px}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.note{border-radius:12px;padding:10px 14px;font-size:.92rem;background:var(--warnbg);color:var(--warn)}
.note.crit{background:var(--critbg);color:var(--crit)}.note.good{background:var(--goodbg);color:var(--good)}.note.info{background:var(--infobg);color:var(--info)}
/* shell */
.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:26px;padding-block:18px 40px}
.rail{position:sticky;top:18px;align-self:start;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:800;font-size:1.3rem;padding:4px 6px 14px}
.brand svg{width:30px;height:30px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 14px;border-radius:14px;border:0;background:transparent;color:var(--mut);font-weight:700;cursor:pointer;text-align:left}
.nav button[aria-current="page"]{background:var(--acsoft);color:var(--ac)}
.nav .bd{position:absolute;right:10px;top:10px;min-width:20px;height:20px;border-radius:10px;background:var(--crit);color:var(--critbg);font-size:.72rem;display:grid;place-items:center;padding:0 5px}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h1{font-size:1.75rem}
.who{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--disp);flex:none;font-size:.95rem}
.av.lg{width:56px;height:56px;font-size:1.3rem}
select,input,textarea{background:var(--sf);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
select.sm,.bar select{min-height:40px;padding:6px 10px}
input[aria-invalid="true"]{border-color:var(--crit)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}.fl{font-weight:700;font-size:.9rem}.hint{font-size:.82rem;color:var(--mut)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
/* hero */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.hero .pl{width:96px;height:96px;border-radius:26px;background:var(--sf2);display:grid;place-items:center;border:1px solid var(--line)}
.hero h2{font-size:clamp(1.55rem,5vw,2.2rem)}
.hero .acts{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.hero.due{border-color:var(--ac);box-shadow:0 0 0 3px var(--acsoft),var(--shadow)}
.hero.missed{border-color:var(--crit);box-shadow:0 0 0 3px var(--critbg),var(--shadow)}
.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.ladder>div{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.82rem;background:var(--sf2)}
.ladder>div.on{border-color:var(--crit);background:var(--critbg);color:var(--crit)}
.ladder b{display:block}
.tl{display:flex;flex-direction:column}
.tl-r{display:grid;grid-template-columns:74px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tl-r:first-child{border-top:0}
.tl-r .t{font-weight:700;font-variant-numeric:tabular-nums}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:1.5rem}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.moods button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;border-radius:14px;border:1.5px solid var(--line);background:var(--sf2);cursor:pointer;font-size:1.6rem;line-height:1.2;padding:6px 2px}
.moods button span{font-size:.7rem;font-weight:700;color:var(--mut);font-family:var(--body)}
.moods button[aria-pressed="true"]{border-color:var(--ac);background:var(--acsoft)}
.cheer{border-radius:14px;padding:10px 14px;background:var(--infobg);color:var(--info)}
.cheer b{font-size:.82rem;display:block}
.med{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.med:first-of-type{border-top:0}
.bar-s{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.bar-s i{display:block;height:100%;background:var(--ac)}
.bar-s.low i{background:var(--crit)}
.heat{display:grid;grid-template-columns:minmax(90px,1.3fr) repeat(7,minmax(34px,1fr));gap:6px;align-items:center;font-size:.82rem;min-width:420px}
.hc{height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--sf2);color:var(--mut)}
.hc.good{background:var(--goodbg);color:var(--good)}.hc.warn{background:var(--warnbg);color:var(--warn)}.hc.crit{background:var(--critbg);color:var(--crit)}.hc.skip{background:var(--infobg);color:var(--info)}
.hh{text-align:center;color:var(--mut);font-weight:700}
.scroll-x{overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--mut)}
svg.sp-chart{width:100%;height:auto;display:block}
.sp-chart .band{fill:var(--acsoft)}.sp-chart .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sp-chart .l1{stroke:var(--ac)}.sp-chart .l2{stroke:var(--info)}
.sp-chart text{fill:var(--mut);font-size:11px;font-family:var(--body)}
.sp-chart .gl{stroke:var(--line);stroke-width:1}
.sp-chart .pt{fill:var(--sf);stroke:var(--ac);stroke-width:2}.sp-chart .pt2{fill:var(--sf);stroke:var(--info);stroke-width:2}
.sp-chart .out{stroke:var(--crit);stroke-width:3}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--sf);min-height:40px;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--acink)}
.pillbtn{border:1.5px solid var(--line);background:var(--sf);border-radius:99px;padding:6px 14px;min-height:38px;font-weight:700;cursor:pointer;color:var(--mut)}
.pillbtn[aria-pressed="true"]{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.sw{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--sf2);display:grid;place-items:center;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ac);box-shadow:0 0 0 3px var(--acsoft)}
.mail{border:1px solid var(--line);border-radius:14px;background:var(--sf);overflow:hidden}
.mail summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mail summary::-webkit-details-marker{display:none}
.mail pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;font:inherit;line-height:1.55}
.mail .mh{padding:0 14px 8px;font-size:.84rem;color:var(--mut)}
.mail .mf{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}
.feed{display:flex;flex-direction:column}
.feed div{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.feed div:first-child{border-top:0}.feed time{color:var(--mut);white-space:nowrap;font-size:.82rem;min-width:92px}
.toggle{display:flex;align-items:center;gap:10px;min-height:40px}
.toggle input{width:22px;height:22px;min-height:0;accent-color:var(--ac)}
/* clock */
#clock{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;max-width:calc(100vw - 28px)}
#clock .cb{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ac);background:var(--sf);color:var(--ink);border-radius:99px;min-height:44px;padding:6px 14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
#clock .cp{position:absolute;right:0;bottom:54px;width:300px;max-width:calc(100vw - 28px);background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
/* modal + toast */
.mo{position:fixed;inset:0;z-index:80;background:rgba(4,21,20,.62);display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.mo-card{background:var(--sf);border-radius:20px;width:min(640px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mo-card.wide{width:min(820px,100%)}
.mo-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 6px;position:sticky;top:0;background:var(--sf)}
.mo-b{padding:8px 18px 20px;display:flex;flex-direction:column;gap:14px}
.mo.sos{background:#7A0F18}.mo.sos .mo-card{background:#B3261E;color:#fff}.mo.sos .mo-h{background:#B3261E}
.mo.sos .btn{color:#fff;border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.14)}
.mo.sos .btn.wh{background:#fff;color:#7A0F18;border-color:#fff}
.mo.sos .ec{background:rgba(0,0,0,.22);border-radius:14px;padding:12px 14px;font-size:.95rem}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(520px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;box-shadow:var(--shadow);animation:tin .25s ease-out}
.toast.crit{background:var(--crit);color:var(--critbg)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
/* gate */
#gate{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:max(18px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:none}
#gate.on{display:block;animation:fadein .6s ease-out}
.gwrap{max-width:900px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start;padding-block:20px}
.gwrap h1{font-size:clamp(1.8rem,5vw,2.6rem)}
.mbtn{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--sf);border-radius:18px;padding:12px 14px;cursor:pointer;min-height:76px}
.mbtn[aria-pressed="true"]{border-color:var(--ac);box-shadow:0 0 0 3px var(--acsoft)}
.mbtn b{font-size:1.1rem;display:block}
.dots{display:flex;gap:14px;justify-content:center;min-height:22px}
.dots i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ac)}
.dots i.f{background:var(--ac)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto}
.pad button{min-height:64px;font-size:1.5rem;font-family:var(--disp);font-weight:800;border-radius:18px;border:1.5px solid var(--line);background:var(--sf);cursor:pointer}
.pad button:active{background:var(--acsoft)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes fadein{from{opacity:0}}
/* splash (deliberately single dark look) */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 90% at 50% 30%,var(--sp-bg1),var(--sp-bg2));color:#E6FFFB;overflow:hidden;transition:opacity .7s ease,transform .7s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#sp-cv{position:absolute;inset:0;width:100%;height:100%}
.sp-brand{position:absolute;top:max(18px,env(safe-area-inset-top,0px));left:max(20px,env(safe-area-inset-left,0px));font-family:var(--disp);font-weight:800;letter-spacing:.02em;color:var(--sp-mint)}
.sp-copy{position:absolute;left:0;right:0;bottom:0;padding:0 max(20px,env(safe-area-inset-right,0px)) max(34px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.sp-title{font-size:clamp(2.6rem,10vw,5.2rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.sp-title span{display:inline-block;opacity:0;transform:translateY(26px);animation:up .75s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(2.4s + var(--i)*.06s)}
.sp-title span.g{color:var(--sp-gold)}
.sp-tag{font-size:clamp(1rem,2.6vw,1.3rem);color:#B9E9E2;opacity:0;animation:up .8s ease forwards;animation-delay:3.2s}
.sp-btn{min-height:56px;padding:12px 34px;border-radius:99px;border:0;background:var(--sp-gold);color:#2A1B00;font-weight:800;font-size:1.1rem;cursor:pointer;opacity:0;animation:up .8s ease forwards;animation-delay:3.8s;font-family:var(--body)}
.sp-sub{font-size:.85rem;color:#8EC9C1;opacity:0;animation:up .8s ease forwards;animation-delay:4.2s}
.sp-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
.sp-bar i{display:block;height:100%;width:0;background:var(--sp-gold);animation:fill 9s linear forwards}
@keyframes up{to{opacity:1;transform:none}}
@keyframes fill{to{width:100%}}
@media (prefers-reduced-motion:reduce){
  .sp-title span,.sp-tag,.sp-btn,.sp-sub{animation:none;opacity:1;transform:none}.sp-bar i{animation:none;width:0}
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);padding-block:12px 150px}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;background:var(--sf);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));flex-direction:row;align-self:auto}
  .rail .brand{display:none}
  .nav{flex-direction:row;width:100%;gap:2px}
  .nav button{flex:1;flex-direction:column;gap:2px;min-height:56px;padding:6px 2px;font-size:.7rem;justify-content:center;text-align:center;min-width:0}
  .nav .bd{right:calc(50% - 26px);top:2px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .gwrap{grid-template-columns:minmax(0,1fr)}
  #clock{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #toasts{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .hero{grid-template-columns:minmax(0,1fr)}.hero .pl{width:80px;height:80px}
  .tl-r{grid-template-columns:62px 34px minmax(0,1fr)}.tl-r .act{grid-column:2/-1}
  .bar h1{font-size:1.45rem}
}
</style>

<div id="splash" role="dialog" aria-label="CareCircle introduction">
